name: Release
run-name: Release ${{ github.ref_name }}

# Тег vX.Y.Z собирает модуль и публикует архив в релиз. На этот архив
# указывает поле `download` в module.json (latest), и оттуда его скачивает
# VTTG при установке модуля из каталога.
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Check tag matches module.json version
        run: |
          version="$(node -p "require('./module.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Тег ${GITHUB_REF_NAME} не совпадает с версией module.json (${version})"
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Плоский архив: module.json рядом с файлами сборки, как в папке модуля мира.
      - name: Pack module
        run: |
          id="$(node -p "require('./module.json').id")"
          mkdir -p package
          cp module.json package/
          cp -r dist/. package/
          (cd package && zip -r "../${id}.zip" .)
          echo "ARCHIVE=${id}.zip" >> "$GITHUB_ENV"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$ARCHIVE" --title "$GITHUB_REF_NAME" --generate-notes
